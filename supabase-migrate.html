<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schafer Olympics · Supabase Migration</title>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:680px;margin:48px auto;padding:0 20px;background:#f7f7f7;color:#171717}main{background:white;border:1px solid #ddd;border-radius:16px;padding:28px;box-shadow:0 8px 28px rgba(0,0,0,.06)}h1{margin-top:0}label{display:block;font-weight:700;margin:22px 0 8px}input,button{font:inherit;padding:12px 14px;border-radius:10px}input{width:100%;box-sizing:border-box;border:1px solid #bbb}button{margin-top:14px;border:0;background:#171717;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}pre{white-space:pre-wrap;background:#f1f1f1;padding:14px;border-radius:10px;min-height:48px}.ok{color:#116329}.err{color:#a61b1b}small{color:#666}</style>
</head>
<body>
<main>
<h1>Supabase Migration</h1>
<p>This copies the current Olympics data from Notion into Supabase. Notion stays in place as the backup.</p>
<label for="code">Admin score-entry code</label>
<input id="code" type="password" autocomplete="off">
<button id="run" type="button">Run migration</button>
<p><small>You can safely run this more than once; records are upserted by their existing Notion IDs.</small></p>
<pre id="status">Ready.</pre>
</main>
<script>
const btn=document.querySelector('#run'),status=document.querySelector('#status'),code=document.querySelector('#code');
btn.addEventListener('click',async()=>{if(!code.value){status.className='err';status.textContent='Enter the admin score-entry code.';return}btn.disabled=true;status.className='';status.textContent='Migrating Notion → Supabase…';try{const r=await fetch('/api/admin/migrate-supabase',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code.value})}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Migration failed');status.className='ok';status.textContent='Migration complete.\n\n'+JSON.stringify(d.counts,null,2)+'\n\nGame Day APIs are now using Supabase as primary.'}catch(e){status.className='err';status.textContent=e.message||'Migration failed.'}finally{btn.disabled=false}});
</script>
</body>
</html>
